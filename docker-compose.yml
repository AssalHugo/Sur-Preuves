services:
  db:
    image: pgvector/pgvector:pg16
    container_name: csc-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-csc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-csc}
      POSTGRES_DB: ${POSTGRES_DB:-csc}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: >
      postgres
      -c shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      -c work_mem=${POSTGRES_WORK_MEM:-16MB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csc} -d ${POSTGRES_DB:-csc}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  review:
    profiles: ["review"]
    build:
      context: .
      dockerfile: backend/Dockerfile.review
    container_name: csc-review
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://csc:csc@db:5432/csc}
      REVIEW_PORT: ${REVIEW_PORT:-8000}
      REVIEW_AUTH: ${REVIEW_AUTH:-local}
    ports:
      - "127.0.0.1:${REVIEW_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    name: csc_pgdata
